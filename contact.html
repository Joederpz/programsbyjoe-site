<section class="band" style="background-image:url('uploads/3/0/5/5/30553863/background-images/2025721285.png'); background-repeat:no-repeat; background-position:50% 50%; background-size:cover"><div class="container">
<div class="text">You can contact Joseph Armienti directly by sending an email to <a href="mailto:armientij@gmail.com">armientij@gmail.com</a>, or using the form below.</div>
<div class="cols"><div class="col" style="flex:1 1 calc(50% - 30px)">
<form class="contact-form" action="https://formsubmit.co/armientij@gmail.com" method="POST">
<h2>Send Joe a message directly!</h2>
<input type="hidden" name="_subject" value="New message from programsbyjoe.com">
<input type="hidden" name="_next" value="https://programsbyjoe.com/thanks.html">
<input type="hidden" name="_template" value="table">
<input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">
<p class="required-note"><span class="req">*</span> Indicates required field</p>
<div class="name-row">
<div><label for="first">Name <span class="req">*</span></label><input id="first" name="first" type="text" placeholder="First" required><small>First</small></div>
<div><label for="last">&nbsp;</label><input id="last" name="last" type="text" placeholder="Last" required><small>Last</small></div>
</div>
<label for="email">Email <span class="req">*</span></label>
<input id="email" name="email" type="email" required>
<label for="comment">Comment <span class="req">*</span></label>
<textarea id="comment" name="comment" rows="9" required></textarea>
<button class="button" type="submit">Submit</button>
</form>
</div><div class="col" style="flex:1 1 calc(50% - 30px)">
<figure style="text-align:center"><img alt="Picture" loading="lazy" src="uploads/3/0/5/5/30553863/published/arcademachine.png"/></figure>
</div></div>
<figure style="text-align:center"><img alt="Picture" loading="lazy" src="uploads/3/0/5/5/30553863/joederpsgreen-2-1_1_orig.png"/></figure>
